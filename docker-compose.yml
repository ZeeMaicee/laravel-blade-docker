# =============================================================================
#  laravel-blade-docker — Laravel + Blade + Docker
#
#  Pemakaian singkat:
#      cp .env.example .env      # lalu ubah DB_PASSWORD & MYSQL_ROOT_PASSWORD
#      docker compose up -d --build
#      open http://localhost:8300
#
#  Rahasia TIDAK ditulis di repo. Semua nilai sensitif dibaca dari .env
#  (diabaikan git) lewat pola ${VAR:?pesan} — compose akan berhenti dengan
#  pesan jelas kalau .env belum diisi.
# =============================================================================

name: laravel-blade-docker

services:
  # ---------------------------------------------------------------------------
  # Aplikasi Laravel (PHP 8.5 + Node 22 + Vite)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: laravel-blade-docker-app
    container_name: laravel-blade-app
    restart: unless-stopped

    ports:
      - "${APP_PORT:-8300}:8000"          # aplikasi   -> http://localhost:8300
      - "${VITE_PORT:-5273}:${VITE_PORT:-5273}"   # Vite HMR (hanya kalau MULAI_VITE=true)

    environment:
      # --- identitas aplikasi ---
      APP_NAME: "${APP_NAME:-Laravel Blade Docker}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Jakarta}"
      APP_URL: "${APP_URL:-http://localhost:8300}"
      APP_LOCALE: "${APP_LOCALE:-id}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-en}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-id_ID}"

      # --- basis data (host `db` = nama service di bawah) ---
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "${DB_DATABASE:-laravel}"
      DB_USERNAME: "${DB_USERNAME:-laravel}"
      DB_PASSWORD: "${DB_PASSWORD:?Isi DB_PASSWORD di .env — jalankan: cp .env.example .env lalu ubah nilainya}"

      # --- sesi / cache / antrean ---
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      CACHE_STORE: "${CACHE_STORE:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      # --- log / surat ---
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      MAIL_MAILER: "${MAIL_MAILER:-log}"

      # --- perilaku entrypoint ---
      JALANKAN_MIGRASI: "${JALANKAN_MIGRASI:-true}"
      TANAM_DATA: "${TANAM_DATA:-true}"
      MULAI_VITE: "${MULAI_VITE:-false}"
      VITE_PORT: "${VITE_PORT:-5273}"

      # Server bawaan PHP hanya melayani satu permintaan sekaligus; tambah worker
      # supaya halaman + healthcheck + permintaan bersamaan tidak saling mengantre.
      PHP_CLI_SERVER_WORKERS: "4"

    volumes:
      # Kode dari host (ubah berkas -> langsung terbaca container).
      - ./:/var/www/html
      # vendor/ dan node_modules/ TIDAK ikut git; isinya diambil dari image
      # (dibuat saat build) dan disimpan di volume anonim milik container.
      - /var/www/html/vendor
      - /var/www/html/node_modules
      # Hasil `npm run build` juga dari image, supaya tampilan tetap benar
      # walau Vite tidak dinyalakan.
      - /var/www/html/public/build

    depends_on:
      db:
        # Menunggu MySQL benar-benar siap — bukan sekadar container menyala.
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Basis data MySQL 8.4
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: laravel-blade-db
    restart: unless-stopped

    ports:
      - "${DB_PORT_PUBLISHED:-3317}:3306"   # opsional, untuk GUI (TablePlus/DBeaver)

    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-laravel}"
      MYSQL_USER: "${DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Isi DB_PASSWORD di .env — jalankan: cp .env.example .env lalu ubah nilainya}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Isi MYSQL_ROOT_PASSWORD di .env — jalankan: cp .env.example .env lalu ubah nilainya}"

    volumes:
      - laravel-blade-data-mysql:/var/lib/mysql      # satu-satunya volume data
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Alat bantu — TIDAK menyala secara bawaan.
  # Jalankan hanya kalau perlu:  docker compose --profile alat up -d
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: laravel-blade-adminer
    profiles: ["alat"]
    restart: unless-stopped
    ports:
      - "8390:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  laravel-blade-data-mysql:
    name: laravel-blade-data-mysql
