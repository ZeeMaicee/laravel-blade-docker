; Setelan PHP untuk wadah aplikasi.
; Disalin ke /usr/local/etc/php/conf.d/99-laravel.ini oleh Dockerfile.

[PHP]
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
post_max_size = 32M
upload_max_filesize = 32M
max_file_uploads = 20

; Zona waktu disamakan dengan APP_TIMEZONE (lihat .env).
date.timezone = Asia/Jakarta

; Jangan membocorkan versi PHP ke header HTTP.
expose_php = Off
display_errors = Off
display_startup_errors = Off

[opcache]
; Laravel memakai OPcache. Karena kode di-bind-mount (bisa berubah tanpa build ulang),
; validasi timestamp dibiarkan aktif.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
